<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/icons/css/icons.css}">

</head>
<body>

<main class="auth-page">

    <div class="auth-card">
        <section th:insert="~{elements/page-banner :: auth-banner}">
        </section>

        <section class="auth-form-section">

            <h2>Вход</h2>

            <p class="subtitle">
                Введите данные для входа в аккаунт
            </p>

            <div class="social-buttons">
                <button class="social-btn">
                    Войти через Google
                </button>

                <button class="social-btn">
                    Войти через GitHub
                </button>
            </div>

            <div class="divider">
                <span>или</span>
            </div>

            <form class="auth-form" th:action="@{/register}" method="post">

                <div class="form-group">
                    <label>Email</label>
                    <input
                            th:field="login"
                            type="email"
                            placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>Пароль</label>

                    <div class="password-field">
                        <input
                                th:field="password"
                                type="password"
                                placeholder="••••••••">
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#">
                        Забыли пароль?
                    </a>
                </div>

                <button class="submit-btn" type="submit">
                    Войти
                </button>

            </form>

            <div class="register-link">
                Нет аккаунта?
                <a href="#">
                    Зарегистрироваться
                </a>
            </div>

        </section>

    </div>

</main>

<footer th:insert="~{elements/page-footer :: page-footer}">
</footer>

</body>
</html>
