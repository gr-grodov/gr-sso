<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" th:href="@{/css/home.css}" href="../static/css/home.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="../static/css/main.css">
    <link rel="stylesheet" th:href="@{/css/page-elements.css}" href="../static/css/page-elements.css"/>
    <link rel="stylesheet" th:href="@{/ss/icons/css/icons.css}" href="../static/css/icons/css/icons.css">
</head>
<body>
<main class="auth-page">

    <div class="auth-card">
        <section th:insert="~{page-banner :: auth-banner}">
        </section>

        <section class="dashboard">

            <div class="status">
                <div class="status-icon">
                    ✓
                </div>

                <span>
                    ВХОД ВЫПОЛНЕН
                </span>
            </div>

            <h2>
                Добро пожаловать
            </h2>

            <p class="user-email">
                Вы вошли как <strong>you@example.com</strong>
            </p>

            <h3>
                ДОСТУПНЫЕ СЕРВИСЫ
            </h3>

            <div class="services">

                <a href="#" class="service-card">
                    <div class="service-icon analytics">
                        А
                    </div>
                    <div>
                        <h4>Аналитика</h4>
                        <p>Дашборд и отчёты</p>
                    </div>
                </a>

                <a href="#" class="service-card">
                    <div class="service-icon docs">
                        Д
                    </div>
                    <div>
                        <h4>Документы</h4>
                        <p>Хранилище файлов</p>
                    </div>
                </a>

                <a href="#" class="service-card">
                    <div class="service-icon tasks">
                        З
                    </div>
                    <div>
                        <h4>Задачи</h4>
                        <p>Трекер проектов</p>
                    </div>
                </a>

                <a href="#" class="service-card">
                    <div class="service-icon settings">
                        Н
                    </div>
                    <div>
                        <h4>Настройки</h4>
                        <p>Управление аккаунтом</p>
                    </div>
                </a>
            </div>

            <div class="dashboard-footer">
                <div class="profile">
                    <div class="avatar">
                        YO
                    </div>

                    <span>
                        you@example.com
                    </span>
                </div>
                <a href="#" class="logout">
                    Выйти
                </a>
            </div>

        </section>
    </div>
</main>
</body>

<footer th:insert="~{page-footer :: page-footer}">
</footer>

</html>
