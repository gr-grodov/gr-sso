<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/page-elements.css}"/>
    <link rel="stylesheet" th:href="@{/css/icons/css/icons.css}">

</head>
<body>

<main class="auth-page">

    <div class="auth-card">
        <section th:insert="~{page-banner :: auth-banner}">
        </section>

        <section class="auth-form-section">

            <h2 th:text="#{login.entry.title}"></h2>

            <p class="subtitle" th:text="#{login.entry.label}"></p>

            <div class="social-buttons">
                <button class="social-btn" onclick="window.location.href='/oauth2/authorization/google'">
                    <i class="fa-brands fa-google" style="color: var(--primary)"></i>
                    <span th:text="#{login.entry.google}"></span>
                </button>

                <button class="social-btn" onclick="window.location.href='/oauth2/authorization/github'">
                    <i class="fa-brands fa-github" style="color: var(--primary)"></i>
                    <span th:text="#{login.entry.github}"></span>
                </button>
            </div>

            <div class="divider">
                <span th:text="#{login.label.or}"></span>
            </div>

            <div class="error-message" th:if="${param.error != null}">
                <span th:text="#{errors. + ${param.error}}"></span>
            </div>

            <form class="auth-form" th:action="@{/login}" method="post">

                <div class="form-group">
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">
                </div>

                <div class="form-group">
                    <label th:text="#{login.fields.email.label}"></label>
                    <input
                        name="username"
                        type="email"
                        required
                        maxlength="256"
                        th:placeholder="#{login.fields.email.hint}">
                </div>

                <div class="form-group">
                    <label th:text="#{login.fields.password.label}"></label>

                    <div class="password-field">
                        <input
                            name="password"
                            type="password"
                            required
                            minlength="8"
                            maxlength="256"
                            th:placeholder="#{login.fields.password.hint}">
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#" th:text="#{login.actions.recover}">
                    </a>
                </div>

                <button class="submit-btn" type="submit"
                    th:text="#{login.entry.button.label}">
                </button>
            </form>

            <div class="register-link">
                <span th:text="#{login.actions.register.hint}"></span>
                <a th:href="@{/register}" th:text="#{login.actions.register.label}"></a>
            </div>

        </section>

    </div>

</main>

<footer th:insert="~{page-footer :: page-footer}">
</footer>

</body>
</html>
