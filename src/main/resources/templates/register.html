<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/page-elements.css}">
    <link rel="stylesheet" th:href="@{/ss/icons/css/icons.css}">

    <script th:src="@{/js/register.js}"></script>
</head>
<body>

<main class="auth-page">

    <div class="auth-card">
        <section th:insert="~{elements/page-banner :: auth-banner}">
        </section>

        <section class="register-section">

            <div class="register-header">
                <a th:href="@{/login}" class="back-btn">
                    ←
                </a>

                <div>
                    <h2 th:text="#{register.title}"></h2>
                    <p th:text="#{register.label}"></p>
                </div>
            </div>

            <form class="register-form" method="post" th:action="@{/register}" th:object="${request}">

                <div class="form-group">
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">
                </div>

                <div class="form-group">
                    <label th:text="#{register.fields.email.label}"></label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        th:field="*{email}"
                        th:placeholder="#{register.fields.email.hint}"
                    >
                    <div
                        class="field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                    </div>
                </div>

                <div class="form-group">
                    <label th:text="#{register.fields.password.label1}"></label>
                    <div class="password-field">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            th:field="*{password}"
                            th:placeholder="#{register.fields.password.hint1}"
                        >
                    </div>
                    <div
                        class="field-error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                    </div>
                </div>

                <div class="form-group">
                    <label th:text="#{register.fields.password.label2}"></label>

                    <div class="password-field">
                        <input
                            id="repeat-password"
                            type="password"
                            th:placeholder="#{register.fields.password.hint2}"
                        >
                    </div>
                </div>

                <ul class="password-rules">

                    <li id="rule-length">
                        Минимум 8 символов
                    </li>

                    <li id="rule-uppercase">
                        Хотя бы одна заглавная буква
                    </li>

                    <li id="rule-lowercase">
                        Хотя бы одна строчная буква
                    </li>

                    <li id="rule-digit">
                        Хотя бы одна цифра
                    </li>

                    <li id="rule-special">
                        Хотя бы один специальный символ
                    </li>

                    <li id="rule-identical">
                        Значение паролей должно быть одинаковым
                    </li>

                </ul>

                <button
                    id="success-register"
                    type="submit"
                    class="register-btn"
                >
                    <span th:text="#{register.actions.submit}"></span>
                </button>
            </form>

            <div class="terms">
                Регистрируясь, вы соглашаетесь с
                <a href="#">условиями использования</a>
                и
                <a href="#">политикой конфиденциальности</a>
            </div>

        </section>

    </div>

</main>

<footer th:insert="~{elements/page-footer :: page-footer}">
</footer>

</body>
</html>
