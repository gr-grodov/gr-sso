spring:
  application:
    name: gr-sso

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gr-sso-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

  jpa:
    hibernate:
      ddl-auto: validate

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_MAIL_USERNAME}
    password: ${SMTP_MAIL_PASSWORD}
    transport:
      protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email

logging:
  file:
    name: ${LOGS_FILENAME}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{userId:-anonymous}] [%X{sessionId:-nosession}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{userId:-anonymous}] [%X{sessionId:-nosession}] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

grsso:
  app:
    backend-uri: ${BACKEND_URL}
  frontend:
    url: ${FRONTEND_URL}
    endpoints:
      provider-error: ${FRONTEND_ENDPOINT_PROVIDER_ERROR:/provider-error}
      login: ${FRONTEND_ENDPOINT_LOGIN:/login}
      oauth-consent: ${FRONTEND_ENDPOINT_OAUTH_CONSENT:/consent-scopes}

  email:
    from-address: ${SMTP_MAIL_USERNAME}
    from-name: GrSSO
    verify-email-code:
      minute-time: 15
      attempt: 5
      check-cron: "0 */15 * * * ?"

  oauth:
    authentication-grant-types:
      - AUTHORIZATION_CODE
      - REFRESH_TOKEN
      - CLIENT_CREDENTIALS
      - DEVICE_CODE

    authentication-methods:
      - CLIENT_SECRET_BASIC
      - CLIENT_SECRET_POST
      - CLIENT_SECRET_JWT
      - PRIVATE_KEY_JWT
      - NONE

  geoip:
    database-path: ${GEOIP_DATABASE_PATH}
    enabled: true
    reload-cron: "0 0 6 2 * *"

  storage:
    default-type: WEB_DAV
    delay-delete-temporary-attachment: 15
    internal:
      path-to-save: ${INTERNAL_STORAGE_PATH}
    webdav:
      base-url: ${WEB_DAV_URL}
      username: ${WEB_DAV_USERNAME}
      password: ${WEB_DAV_PASSWORD}